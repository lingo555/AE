<!DOCTYPE html>

<html lang="ja">

<head>
  <title>アナデン雑魚敵図鑑</title>
  <meta charset="utf-8">
  <meta name="description" content="雑魚敵必ず倒す。">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, minimum-scale=1, maximum-scale=1">
  <meta property="og:title" content="アナデン雑魚敵図鑑">
  <meta property="og:description" content="雑魚敵必ず倒す。">
  <meta property="og:image" content="./tool-logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@atoenisfu">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
  <script defer src="script.js"></script>
</head>

<body>
  <div id="filterForm">
    <div>
      <label>
        敵
        <input type="search" id="filterName" placeholder="検索">
      </label>

      <label>
        出現エリア
        <input type="search" id="filterArea" placeholder="検索">
      </label>

      <label>
        ドロップ
        <input type="search" id="filterDrop" placeholder="検索">
      </label>
    </div>

    <div class="radio-filter">
      <span>時代：</span>
      <label>
        <input type="radio" name="filterTime" value="" checked>
        すべて
      </label>
      <div id="filterTimeOptions"></div>
    </div>

    <div class="radio-filter">
      <span>敵分類：</span>
      <label>
        <input type="radio" name="filterType" value="" checked>
        すべて
      </label>
      <div id="filterTypeOptions"></div>
    </div>

    <button id="resetButton" type="button">リセット</button>
  </div>

  <table id="sheetTable">
    <thead></thead>
    <tbody></tbody>
  </table>

</body>

</html>
